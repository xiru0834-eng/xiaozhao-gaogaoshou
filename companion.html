   <div class="code-box"><div class="code-meta"><small>公开内推码</small><code id="code"></code></div><button id="copy" class="code-copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 5V3H4v13h2"/></svg>复制</button></div>

 <div class="skin-picker" aria-label="选择陪伴角色">

  <button class="skin-choice" data-skin-option="blue" aria-pressed="false" title="霁蓝 · 安静"><span class="portrait"></span>霁蓝</button>
  <button class="skin-choice" data-skin-option="sakura" aria-pressed="false" title="绯樱 · 傲娇"><span class="portrait"></span>绯樱</button>

 </div>

<div id="toast" class="toast" hidden role="status"><span id="toast-text"></span><button id="undo" hidden>撤销</button><button id="toast-close" aria-label="关闭提示">×</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id), applied=new Set(['已投','笔试','面试','Offer','结束']);
const companionSkins={
 mint:{name:'薄荷石墨',quote:'慢慢来，我陪你选。'},
 blue:{name:'霁蓝',quote:'……整理好了。下一家。'},
 sakura:{name:'绯樱',quote:'别错过啦，我帮你记着呢。'},
 violet:{name:'紫夜',quote:'喝口热的，再看下一家吧。'},
 amber:{name:'琥珀',quote:'准备好了吗？一起出发！'}
};
function setCompanionSkin(value,persist=true){
 const skin=Object.prototype.hasOwnProperty.call(companionSkins,value)?value:'mint';
 document.documentElement.dataset.skin=skin;
 $('partner-name').textContent=companionSkins[skin].name;$('partner-quote').textContent=companionSkins[skin].quote;
 document.querySelectorAll('[data-skin-option]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.skinOption===skin));
 if(persist){try{localStorage.setItem('companion-skin-v1',skin);}catch(e){toast('这次换装已生效，外观偏好暂未保存。');}}
}
let storedSkin='mint';try{storedSkin=localStorage.getItem('companion-skin-v1')||'mint';}catch(e){}
setCompanionSkin(storedSkin,false);
document.querySelectorAll('[data-skin-option]').forEach(b=>b.onclick=()=>setCompanionSkin(b.dataset.skinOption));
let bridge, companies=[], statuses={}, selected='', filtered=[], tab='all', onlyCode=false, recent=false, ready=false, saving=false, pending=null, undo=null, pollBusy=false, toastTimer, editVersion=0;
let bookmark=null,navigationLoaded=false,navigationTimer,navigationQueue=Promise.resolve(),bookmarkBusy=false,restoring=false;
const bookmarkIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4V3Z"/></svg>';
function capturePosition(name=selected){
 const list=$('companies'),top=list.getBoundingClientRect().top;
 const row=Array.from(list.querySelectorAll('[data-name]')).find(r=>r.getBoundingClientRect().bottom>top);
 return {name,anchor:row?.dataset.name||name,offset:row?Math.max(0,top-row.getBoundingClientRect().top):0,scroll:list.scrollTop,query:$('search').value.slice(0,500),owner:$('owner').value,stage:$('stage').value,tab,onlyCode,recent};
}
function persistPosition(kind,point){
 const write=navigationQueue.catch(()=>{}).then(()=>{
  if(!bridge?.save_navigation)throw Error('Navigation storage unavailable');
  return bridge.save_navigation(kind,point);
 });
 navigationQueue=write;
 return write;
}
function rememberBrowse(){
 clearTimeout(navigationTimer);
 if(!ready||!navigationLoaded||restoring||document.body.classList.contains('collapsed'))return;
 navigationTimer=setTimeout(()=>persistPosition('browse',capturePosition()).catch(()=>toast('浏览位置暂未保存，请稍后再试。')),200);
}
function updateBookmark(){
 $('bookmark-tools').hidden=!bookmark;
 $('bookmark-return').innerHTML=bookmarkIcon+esc(bookmark?'回到 · '+bookmark.name:'');
 $('bookmark-return').title=bookmark?'回到书签：'+bookmark.name+'（同时恢复筛选）':'';
}
async function markBookmark(name){
 if(bookmarkBusy||!ready)return;
 bookmarkBusy=true;
 const point=name?capturePosition(name):null;
 try{await persistPosition('bookmark',point);bookmark=point;render();toast(name?'已标记：'+name+'。上方可随时回到这里。':'位置书签已清除');}
 catch(e){toast('书签保存失败，原书签未改变。请重试。');}
 finally{bookmarkBusy=false;}
}
function restorePosition(point,manual=false){
 if(!point||typeof point.name!=='string')return;
 if(point.name&&!companies.some(c=>c.name===point.name)){if(manual)toast('这家公司已不在当前台账中，可重新标记。');return;}
 restoring=true;
 $('search').value=point.query||'';$('owner').value=point.owner||'全部性质';$('stage').value=point.stage||'全部进度';
 tab=point.tab||'all';onlyCode=!!point.onlyCode;recent=!!point.recent;selected=point.name;
 render();
 let relaxed=false;
 if(manual&&!filtered.some(c=>c.name===point.name)){reset();selected=point.name;render();relaxed=true;}
 document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));
 $('only-code').setAttribute('aria-pressed',onlyCode);$('recent').setAttribute('aria-pressed',recent);
 const list=$('companies');list.scrollTop=Math.max(0,Number(point.scroll)||0);
 const anchor=Array.from(list.querySelectorAll('[data-name]')).find(r=>r.dataset.name===point.anchor);
 if(anchor)list.scrollTop+=anchor.getBoundingClientRect().top-list.getBoundingClientRect().top+Math.max(0,Number(point.offset)||0);
 if(manual){document.querySelector('.company-row[aria-pressed=true]')?.scrollIntoView({block:'nearest'});toast(relaxed?'公司状态已变化，已放宽筛选并定位书签。':'已回到书签：'+point.name);}
 restoring=false;rememberBrowse();
}
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasCode=r=>/^[A-Za-z0-9]{4,24}$/.test(r.code||'');
const layout={selection:false,filters:false,comfortable:false};
try{const saved=JSON.parse(localStorage.getItem('companion-layout-v1')||'{}');for(const key of Object.keys(layout)){if(typeof saved?.[key]==='boolean')layout[key]=saved[key];}}catch(e){}
function rememberLayout(){try{localStorage.setItem('companion-layout-v1',JSON.stringify(layout));}catch(e){}}
function closeSource(){
 if($('details').contains(document.activeElement))$('details-toggle').focus();
 $('details').hidden=true;$('details-toggle').setAttribute('aria-expanded','false');
}
function setDisclosure(kind,open,persist=true){
 const panel=$(kind==='selection'?'selection-body':'filter-panel');
 const toggle=$(kind==='selection'?'panel-toggle':'filters-collapse');
 if(!open&&panel.contains(document.activeElement))toggle.focus();
 layout[kind]=open;panel.hidden=!open;toggle.setAttribute('aria-expanded',open);
 if(kind==='selection'){$('panel-label').textContent=open?'收起详情':'内推 / 进度';if(!open)closeSource();}
 else{toggle.textContent=open?'收起':'筛选';toggle.setAttribute('aria-label',open?'收起筛选区域':'展开筛选区域');}
 if(persist)rememberLayout();
}
function setDensity(comfortable,persist=true){
 layout.comfortable=comfortable;document.body.classList.toggle('comfortable',comfortable);
 $('density').setAttribute('aria-pressed',comfortable);
 $('density').textContent=comfortable?'列表密度：宽松 · 切换为紧凑':'列表密度：紧凑 · 切换为宽松';
 if(persist)rememberLayout();
}
setDisclosure('selection',layout.selection,false);setDisclosure('filters',layout.filters,false);setDensity(layout.comfortable,false);
function note(text,error=false){$('save-message').textContent=text;$('footer').classList.toggle('error',error);$('retry').hidden=!error;}
function toast(text,action=null){clearTimeout(toastTimer);$('toast-text').textContent=text;$('toast').hidden=false;undo=action;$('undo').hidden=!action;toastTimer=setTimeout(()=>$('toast').hidden=true,action?10000:3200);}
function closeSheets(){$('today-sheet').hidden=$('menu-sheet').hidden=true;$('today').setAttribute('aria-expanded','false');$('more').setAttribute('aria-expanded','false');interaction();}
function current(){return companies.find(c=>c.name===selected);}
function setSnapshot(data){
 const changed=!ready||JSON.stringify(data.companies||companies)!==JSON.stringify(companies)||JSON.stringify(data.statuses||statuses)!==JSON.stringify(statuses);
 if(data.companies)companies=data.companies;
 statuses=data.statuses||statuses;
 if(pending)statuses[pending.name]=pending.status;
 $('today-count').textContent=data.todayUnavailable?'—':String((data.today||[]).length);
 $('today-list').innerHTML=(data.today||[]).length?data.today.map(n=>`<li>${esc(n)}<small>已记录 ✓</small></li>`).join(''):'<li>今天还没有记录。投完一家，点「记为已投」就好。</li>';
 $('date-line').textContent=`${data.date||''} · 一家一家来`;
 $('schedule-shortcut').textContent=(data.schedule?.label||'面试日程 · 今日／接下来')+' ›';
 $('schedule-shortcut').title=data.schedule?.label||'打开完整版的面试日程';
 if(data.shell)window.shellState(data.shell);
 if(data.warning)note(data.warning,true);
 ready=true;
 if(!navigationLoaded){navigationLoaded=true;bookmark=data.navigation?.bookmark||null;if(data.navigationError)toast(data.navigationError);render();restorePosition(data.navigation?.browse);}
 else if(changed)render();
}
function render(){
 $('total').textContent=companies.length;$('todo').textContent=companies.filter(c=>(statuses[c.name]||'未投')==='未投').length;$('applied').textContent=companies.filter(c=>applied.has(statuses[c.name])).length;
 const query=$('search').value.trim().toLowerCase(),owner=$('owner').value,stage=$('stage').value;
 filtered=companies.filter(c=>{
  const st=statuses[c.name]||'未投';
  return (!query||[c.name,c.roles,c.city,c.code,c.note,c.industry,c.owner].join(' ').toLowerCase().includes(query))&&
  (tab==='all'||(tab==='applied'?applied.has(st):st===tab))&&(owner==='全部性质'||c.owner===owner)&&(stage==='全部进度'||st===stage)&&(!onlyCode||hasCode(c))&&(!recent||c.added);
 });
 if(!filtered.some(c=>c.name===selected)){selected=filtered[0]?.name||'';closeSource();}
 $('count').textContent=`${filtered.length} 家`;$('clear').hidden=!query;
 $('filter-toggle').textContent=(owner!=='全部性质'||stage!=='全部进度')?'筛选 · 已生效':'筛选 ▾';
 const conditions=[tab==='applied'?'已投递':tab==='未投'?'待投递':'',owner==='全部性质'?'':owner,stage==='全部进度'?'':stage,onlyCode?'有内推码':'',recent?'最近新增':''].filter(Boolean);
 $('filter-summary').textContent=conditions.join(' · ')||'全部公司';$('filter-summary').title=conditions.join(' · ')||'全部公司';
 const scroll=$('companies').scrollTop;
 $('companies').innerHTML=filtered.length?filtered.map(c=>{
  const st=statuses[c.name]||'未投',badge=applied.has(st)?'done':'';
  return `<li class="company-item"><button class="company-row" data-name="${esc(c.name)}" aria-pressed="${c.name===selected}" title="${esc(c.name)}"><span class="initial" aria-hidden="true">${esc(c.name[0])}</span><span class="company-text"><strong>${esc(c.name)}</strong><small>${esc(c.owner)} · ${esc(c.city)}${c.added?' · 新增':''}</small></span><span class="badge ${badge} ${st==='面试'?'interview':''}">${esc(st)}</span></button><button class="bookmark-mark" data-bookmark="${esc(c.name)}" aria-label="标记这里：${esc(c.name)}" title="标记这里，下次一键返回" aria-pressed="${bookmark?.name===c.name}">${bookmarkIcon}</button></li>`;
 }).join(''):'<li class="empty"><b>这组条件下，暂时没找到。</b><p>试试换个关键词，或放宽筛选。</p><button id="reset">清空全部筛选</button></li>';
 $('companies').scrollTop=scroll;renderDetail();updateBookmark();rememberBrowse();
}
function renderDetail(){
 const c=current();$('selected').hidden=!c;if(!c)return;
 const st=statuses[c.name]||'未投';
 $('selection-caption').textContent=`当前公司 · ${st}${hasCode(c)?' · 有内推码':''}`;
 $('company-name').textContent=c.name;$('company-name').title=c.name;$('company-roles').textContent=c.roles+' · '+c.city;
 $('details').textContent=`${c.owner} · ${c.industry}\n截止：${c.deadline||'日期待核实'} / ${c.deadlineText}\n来源 / 备用码：${c.source||'未提供'}\n${c.note}\n入口：${c.url||'见备注'}`;
 $('code').textContent=hasCode(c)?c.code:'暂未收录';$('copy').disabled=!hasCode(c);
 $('status').value=st;$('status').disabled=!ready||saving||!!pending;
 $('mark').disabled=!ready||saving||!!pending||applied.has(st);$('mark').textContent=applied.has(st)?'✓ 已记录':'✓ 记为已投';
 $('open').disabled=!/^https?:\/\//.test(c.url);$('open').childNodes[0].textContent=c.url.includes('bing.com/search')?'查找官方入口 ':'去官网投递 ';
}
function reset(){tab='all';onlyCode=recent=false;$('search').value='';$('owner').value='全部性质';$('stage').value='全部进度';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab==='all'));$('only-code').setAttribute('aria-pressed','false');$('recent').setAttribute('aria-pressed','false');render();}
async function save(name,status,isUndo=false){
 if(saving||!ready)return;
 editVersion++;
 const previous=statuses[name]||'未投';pending={name,status,previous};saving=true;interaction();renderDetail();note('正在保存，请稍等…');
 try{const result=await bridge.save_status(name,status);pending=null;setSnapshot(result);note(result.warning||'已保存 · 进度和完整版同步',!!result.warning);toast(isUndo?'已撤销这次标记':`${name} · 已保存为${status}`,isUndo?null:{name,status:previous});}
 catch(e){note('还没确认保存成功 · 请重试，不要退出',true);}
 finally{saving=false;renderDetail();interaction();}
}
async function refresh(){
 if(pollBusy||saving||pending)return;pollBusy=true;
 const version=editVersion;
 try{const data=await bridge.snapshot();if(version!==editVersion||saving||pending)return;setSnapshot(data);if(!data.warning)note('本地保存 · 与完整版共用进度');}
 catch(e){if(version===editVersion&&!saving&&!pending){ready=false;renderDetail();note('暂时连不上台账 · 点击重试',true);}}
 finally{pollBusy=false;}
}
function interaction(){if(bridge?.interaction){const tag=document.activeElement?.tagName;bridge.interaction(!document.hasFocus()?false:(['INPUT','SELECT'].includes(tag)||!$('menu-sheet').hidden||!$('today-sheet').hidden),saving||!!pending).catch(()=>{});}}
window.shellState=s=>{document.body.classList.toggle('collapsed',!!s.collapsed);document.body.dataset.side=s.side==='left'?'left':'right';$('edge-direction').textContent=s.side==='left'?'›':'‹';$('pin').setAttribute('aria-pressed',!!s.pinned);$('pin').title=s.pinned?'已固定，点击恢复自动收起':'固定后，离开也不收起';};
async function shell(action){if((saving||pending)&&['collapse','close'].includes(action)){toast('还有状态没保存好，先重试一下。');return;}closeSheets();try{if(ready&&['collapse','close'].includes(action)&&!document.body.classList.contains('collapsed')){clearTimeout(navigationTimer);await persistPosition('browse',capturePosition());}window.shellState(await bridge.window_action(action));}catch(e){toast('操作未完成，浏览位置可能未保存，请重试。');}}
function step(delta){if(!filtered.length)return;const i=filtered.findIndex(c=>c.name===selected);selected=filtered[(i+delta+filtered.length)%filtered.length].name;closeSource();render();document.querySelector('.company-row[aria-pressed=true]')?.scrollIntoView({block:'nearest'});}
$('panel-toggle').onclick=()=>setDisclosure('selection',!layout.selection);
$('schedule-shortcut').onclick=()=>shell('schedules');
$('filters-collapse').onclick=()=>setDisclosure('filters',!layout.filters);
$('density').onclick=()=>{setDensity(!layout.comfortable);closeSheets();};
$('search').addEventListener('input',render);$('clear').onclick=()=>{$('search').value='';render();$('search').focus();};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('stage').value='全部进度';document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
$('filter-toggle').onclick=()=>{const show=$('filter-extra').hidden;$('filter-extra').hidden=!show;$('filter-toggle').setAttribute('aria-expanded',show);};
$('only-code').onclick=()=>{onlyCode=!onlyCode;$('only-code').setAttribute('aria-pressed',onlyCode);render();};$('recent').onclick=()=>{recent=!recent;$('recent').setAttribute('aria-pressed',recent);render();};$('owner').onchange=$('stage').onchange=render;
$('companies').onclick=e=>{if(e.target.closest('#reset'))return reset();const mark=e.target.closest('[data-bookmark]');if(mark)return markBookmark(mark.dataset.bookmark);const b=e.target.closest('[data-name]');if(b){selected=b.dataset.name;closeSource();render();}};
$('companies').addEventListener('scroll',rememberBrowse,{passive:true});
$('bookmark-return').onclick=()=>restorePosition(bookmark,true);$('bookmark-clear').onclick=()=>markBookmark(null);
$('copy').onclick=async()=>{if(!current())return;try{const code=await bridge.copy_code(selected);if(!window.pywebview)await navigator.clipboard.writeText(code);toast('内推码已复制，去表单粘贴吧。');}catch(e){toast('复制失败，可在详情中选择文字手动复制。');}};
$('open').onclick=async()=>{try{await bridge.open_role(selected);toast('入口已打开，投完后再记为已投。');}catch(e){toast('入口未打开，请在详情中查看网址。');}};
$('mark').onclick=()=>save(selected,'已投');$('status').onchange=()=>save(selected,$('status').value);$('next').onclick=()=>step(1);$('previous').onclick=()=>step(-1);
$('details-toggle').onclick=()=>{$('details').hidden=!$('details').hidden;$('details-toggle').setAttribute('aria-expanded',!$('details').hidden);};
$('retry').onclick=()=>pending?save(pending.name,pending.status):refresh();$('undo').onclick=()=>{const item=undo;$('toast').hidden=true;if(item)save(item.name,item.status,true);};$('toast-close').onclick=()=>{$('toast').hidden=true;};
$('pin').onclick=()=>shell('pin');$('collapse').onclick=()=>shell('collapse');$('edge').onclick=()=>shell('expand');document.querySelectorAll('[data-window]').forEach(b=>b.onclick=()=>shell(b.dataset.window));
$('today').onclick=()=>{const show=$('today-sheet').hidden;closeSheets();$('today-sheet').hidden=!show;$('today').setAttribute('aria-expanded',show);interaction();};$('more').onclick=()=>{const show=$('menu-sheet').hidden;closeSheets();$('menu-sheet').hidden=!show;$('more').setAttribute('aria-expanded',show);interaction();};document.querySelectorAll('.sheet-close').forEach(b=>b.onclick=closeSheets);
try{document.documentElement.dataset.theme=localStorage.getItem('companion-theme')||'light';}catch(e){}
$('theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('companion-theme',t);}catch(e){}closeSheets();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('today-sheet').hidden||!$('menu-sheet').hidden)closeSheets();else if(!$('details').hidden)closeSource();else if(layout.selection)setDisclosure('selection',false);else if(layout.filters)setDisclosure('filters',false);else shell('collapse');}if(e.ctrlKey&&e.key==='f'){e.preventDefault();$('search').focus();}});
document.addEventListener('focusin',interaction);document.addEventListener('focusout',()=>setTimeout(interaction,0));window.addEventListener('blur',interaction);window.addEventListener('focus',()=>{interaction();refresh();});window.addEventListener('beforeunload',e=>{if(pending||saving){e.preventDefault();e.returnValue='';}});
function start(api){if(bridge)return;bridge=api;refresh();setInterval(refresh,5000);}
window.addEventListener('pywebviewready',()=>start(window.pywebview.api));
if(window.previewBridge)start(window.previewBridge);
</script></body></html>
