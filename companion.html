.intro{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 16px 10px;flex-shrink:0}.intro h1{font-size:19px;letter-spacing:.1px;line-height:1.35;margin:0 0 3px;font-weight:700}.intro p{margin:0;font-size:11px;color:var(--muted)}.today{border:1px solid var(--line);background:var(--surface);padding:7px 10px;border-radius:10px;display:flex;align-items:center;gap:8px;white-space:nowrap}.today small{font-size:10px;color:var(--muted);display:block}.today b{font-size:18px;font-weight:700;color:var(--brand);font-variant-numeric:tabular-nums}.today .arrow{font-size:14px;color:var(--muted)}
.toolbar{padding:0 16px;flex-shrink:0}.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--muted)}.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 2px var(--soft)}.search input{width:100%;min-width:0;outline:none;border:0;background:transparent;color:var(--ink);font-size:12px}.search input::placeholder{color:var(--muted)}.clear{padding:0 3px;color:var(--muted);font-size:18px}.tabs{display:flex;align-items:center;border-bottom:1px solid var(--line);gap:16px;margin-top:9px}.tab{position:relative;padding:9px 0 10px;color:var(--muted);font-size:12px}.tab b{font-size:10px;font-weight:500;margin-left:4px}.tab[aria-pressed=true]{font-weight:700;color:var(--brand)}.tab[aria-pressed=true]:after{content:'';height:3px;position:absolute;bottom:-1px;left:0;right:0;border-radius:3px;background:var(--brand)}

.list{flex:1;min-height:100px;overflow:auto;overscroll-behavior:contain;margin:0;padding:0 8px 8px;list-style:none;scrollbar-width:thin;scrollbar-color:#bdcec4 transparent}.company-row{width:100%;display:flex;align-items:center;gap:10px;padding:10px 9px;border:1px solid transparent;border-radius:10px;text-align:left;margin:2px 0;min-width:0;transition:background .15s}.company-row:hover{background:var(--surface)}.company-row[aria-pressed=true]{background:var(--surface);border-color:var(--line);box-shadow:0 2px 8px #122a1c06}.initial{display:grid;place-items:center;width:34px;height:34px;flex:0 0 34px;background:var(--soft);border:1px solid var(--line);border-radius:10px;color:var(--brand);font-size:14px;font-weight:700}.company-row:nth-child(even) .initial{background:var(--hover)}.company-text{flex:1;min-width:0}.company-text strong{display:block;font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.company-text small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:10px;margin-top:4px}.badge{font-size:10px;padding:3px 6px;border-radius:5px;background:var(--bg);color:var(--muted);white-space:nowrap}.badge.done{background:var(--soft);color:var(--brand)}.badge.interview{color:var(--gold);background:var(--hover)}.empty{padding:28px 20px;text-align:center;color:var(--muted)}.empty b{display:block;margin:8px 0;color:var(--ink);font-size:14px}.empty p{margin:0 0 12px;font-size:12px}.empty button{color:var(--brand);text-decoration:underline}
.selected{background:var(--surface);border-top:1px solid var(--line);padding:13px 16px 10px;flex-shrink:0;box-shadow:0 -4px 16px #132d1b04}.selection-head{display:flex;align-items:flex-start;gap:8px}.selection-title{min-width:0;flex:1}.selection-title h2{font-size:15px;line-height:1.4;margin:0;overflow-wrap:anywhere}.selection-title p{font-size:11px;color:var(--muted);line-height:1.55;margin:3px 0 9px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.detail-toggle{font-size:11px;color:var(--muted);padding:1px 0;white-space:nowrap}.detail-toggle:hover{color:var(--brand)}.detail-body{font-size:11px;color:var(--muted);max-height:150px;overflow:auto;padding-bottom:10px;overflow-wrap:anywhere;white-space:pre-wrap}.code-box{background:var(--bg);border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:5px}.code-box .code-meta{flex:1;min-width:0}.code-meta small{display:block;color:var(--muted);font-size:9px;line-height:1.1}.code-meta code{font:650 14px/1.7 'Cascadia Code',Consolas,monospace;color:var(--ink);overflow-wrap:anywhere}.code-copy{font-size:11px;color:var(--brand);padding:6px 0 6px 8px;min-height:32px;white-space:nowrap}.code-copy svg{width:15px;margin-right:3px}.source-note{margin:0 0 10px;font-size:9px;color:var(--muted)}
.actions{display:flex;gap:8px}.btn{min-height:36px;border-radius:9px;padding:8px 10px;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:var(--surface)}.btn:hover{background:var(--hover)}.btn.primary{flex:1;background:var(--brand);border-color:var(--brand);color:var(--surface)}:root[data-theme=dark] .btn.primary{color:#14201b}.btn.primary:hover{filter:brightness(.95)}.btn.soft{background:var(--soft);color:var(--brand);border-color:var(--soft)}.actions .btn svg{width:15px}.workflow{display:flex;align-items:center;gap:7px;margin-top:9px;color:var(--muted);font-size:10px}.workflow select{font-size:11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);padding:4px 7px;max-width:120px}.next{font-size:11px;color:var(--brand);padding:4px 0;margin-left:auto}.previous{font-size:12px;color:var(--muted);padding:4px}
.footer{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--surface);border-top:1px solid var(--line);flex-shrink:0;min-height:35px}.save-dot{width:5px;height:5px;flex-shrink:0;border-radius:50%;background:var(--brand)}.footer p{font-size:10px;color:var(--muted);margin:0;flex:1;line-height:1.5}.footer.error p{color:var(--alert)}.footer.error .save-dot{background:var(--alert)}.footer button{font-size:10px;color:var(--brand);padding:2px}.toast{position:fixed;bottom:45px;left:12px;right:12px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow);border-radius:10px;padding:11px 13px;font-size:12px;display:flex;align-items:center;gap:8px;z-index:5}.toast span{flex:1}.toast button{color:var(--surface);text-decoration:underline;white-space:nowrap}
.sheet{position:absolute;z-index:4;top:52px;left:8px;right:8px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--line);border-radius:12px;padding:16px;max-height:calc(100vh - 90px);overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.sheet h2{font-size:15px;margin:0}.sheet p{font-size:11px;color:var(--muted);line-height:1.8}.sheet ul{list-style:none;padding:0;margin:12px 0}.sheet li{padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.sheet li small{float:right;color:var(--brand)}.menu-grid{display:grid;gap:6px}.menu-grid button{text-align:left;padding:9px 10px;border-radius:8px;background:var(--bg);font-size:12px}

@media(max-height:590px){.intro{padding:9px 16px 7px}.intro h1{font-size:16px}.intro p{display:none}.today{padding:4px 8px}.today small{font-size:9px}.today b{font-size:15px}.selected{padding-top:9px}.source-note{display:none}.list{min-height:40px}.selection-title p{margin-bottom:6px;-webkit-line-clamp:1}.titlebar{height:46px}.tabs{margin-top:4px}.filters{margin:6px 0}.sheet{top:46px}.toolbar{position:relative}.filter-extra{position:absolute;top:100%;left:10px;right:10px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:3}}
@media(max-width:340px){.toolbar{padding:0 10px}.intro,.selected,.footer{padding-left:10px;padding-right:10px}.brand small{display:none}.brand strong{font-size:12px}.titlebar{padding:7px 9px;gap:3px}.icon-btn{padding:6px;min-width:28px}.intro h1{font-size:16px}.tabs{gap:13px}.company-row{gap:7px}.initial{width:30px;height:30px;flex-basis:30px}}
.selected{position:relative}.selection-title h2{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.detail-body{position:absolute;bottom:100%;left:8px;right:8px;z-index:3;max-height:min(220px,35vh);background:var(--surface);padding:12px;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="app">
 <header class="titlebar">
  <div class="brand pywebview-drag-region"><img src="__MASCOT__" alt=""><div><strong>校招高高手</strong><small>陪你找到下一个好机会</small></div></div>
  <button id="pin" class="icon-btn" aria-label="固定在桌面上" title="固定后，离开也不收起" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m8 3 8 0-1 6 3 4v2H6v-2l3-4-1-6ZM12 15v6"/></svg></button>
  <button id="collapse" class="icon-btn" aria-label="收起到屏幕边缘" title="收起到屏幕边缘"><svg viewBox="0 0 24 24"><path d="M5 5v14M11 7l5 5-5 5M19 5v14"/></svg></button>
  <button id="more" class="icon-btn" aria-label="更多设置" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
 </header>
 <section class="intro"><div><h1>机会，慢慢靠近。</h1><p id="date-line">今天的进度，一起记好。</p></div><button id="today" class="today" aria-expanded="false"><span><small>今日记录投递</small><b id="today-count">—</b><small style="display:inline;margin-left:4px">家</small></span><span class="arrow">›</span></button></section>
 <section class="toolbar" aria-label="搜索与筛选">
  <label class="search"><svg viewBox="0 0 24 24"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input id="search" placeholder="找公司、Agent 岗位、城市…" aria-label="搜索公司、岗位或城市" autocomplete="off"><button class="clear" id="clear" aria-label="清空搜索" type="button" hidden>×</button></label>
  <nav class="tabs" aria-label="常用投递状态"><button class="tab" data-tab="all" aria-pressed="true">全部 <b id="total">—</b></button><button class="tab" data-tab="未投" aria-pressed="false">待投递 <b id="todo">—</b></button><button class="tab" data-tab="applied" aria-pressed="false">已投递 <b id="applied">—</b></button></nav>
  <div class="filters"><button id="filter-toggle" class="chip" aria-expanded="false">筛选 ▾</button><button id="only-code" class="chip" aria-pressed="false">有内推码</button><button id="recent" class="chip" aria-pressed="false">最近新增</button><span class="result-count" id="count">加载中</span></div>
  <div class="filter-extra" id="filter-extra" hidden><label>公司性质<select id="owner"><option>全部性质</option><option>私企</option><option>外企</option><option>央国企</option><option>科研/事业单位</option></select></label><label>具体进度<select id="stage"><option>全部进度</option><option>未投</option><option>已投</option><option>笔试</option><option>面试</option><option>Offer</option><option>结束</option><option>无合适岗位</option></select></label></div>
 </section>
 <ul id="companies" class="list" aria-label="公司列表"><li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li></ul>
 <section class="selected" id="selected" aria-label="当前公司操作" hidden>
  <div class="selection-head"><div class="selection-title"><h2 id="company-name"></h2><p id="company-roles"></p></div><button class="detail-toggle" id="details-toggle" aria-expanded="false">详情 ▾</button></div>
  <div class="detail-body" id="details" hidden></div>
  <div class="code-box"><div class="code-meta"><small>公开内推码</small><code id="code"></code></div><button id="copy" class="code-copy"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 5V3H4v13h2"/></svg>复制</button></div>
  <p class="source-note">公开来源未经实测 · 先核验批次，再填写推荐码</p>
  <div class="actions"><button class="btn primary" id="open">去官网投递 <svg viewBox="0 0 24 24"><path d="M7 17 17 7M7 7h10v10"/></svg></button><button class="btn soft" id="mark">✓ 记为已投</button></div>
  <div class="workflow"><span>当前进度</span><select id="status" aria-label="修改当前公司的投递状态"><option>未投</option><option>已投</option><option>笔试</option><option>面试</option><option>Offer</option><option>结束</option><option>无合适岗位</option></select><button class="previous" id="previous" aria-label="上一家公司">‹</button><button class="next" id="next">下一家 ›</button></div>
 </section>
 <footer class="footer" id="footer"><span class="save-dot"></span><p id="save-message" role="status" aria-live="polite">正在连接本地台账…</p><button id="retry" hidden>重试</button></footer>
</div>
<button class="edge" id="edge" aria-label="展开校招高高手"><img src="__MASCOT__" alt=""><span>校<br>招</span><span>‹</span></button>
<section id="today-sheet" class="sheet" aria-label="今日记录明细" hidden><div class="sheet-head"><h2>今天留下的脚印</h2><button class="icon-btn sheet-close" aria-label="关闭今日明细">×</button></div><p>只记录在小助手里确认并保存成功的投递，同一家每天只算一次。历史和其他窗口的操作不补猜。</p><ul id="today-list"></ul><p>按本机日期统计。误标后改回“未投”，会撤销当天这条计数。</p></section>
<section id="menu-sheet" class="sheet" aria-label="窗口设置" hidden><div class="sheet-head"><h2>按你的习惯来</h2><button class="icon-btn sheet-close" aria-label="关闭设置">×</button></div><p>拖动顶部标题移动小窗，固定后会一直陪在网页旁。</p><div class="menu-grid"><button id="theme">切换深色 / 浅色</button><button data-window="full">打开完整台账 ↗</button><button data-window="left">贴到左边</button><button data-window="right">贴到右边</button><button data-window="close">退出小助手</button></div></section>
<div id="toast" class="toast" hidden role="status"><span id="toast-text"></span><button id="undo" hidden>撤销</button><button id="toast-close" aria-label="关闭提示">×</button></div>
<script>
'use strict';
const $=id=>document.getElementById(id), applied=new Set(['已投','笔试','面试','Offer','结束']);
let bridge, companies=[], statuses={}, selected='', filtered=[], tab='all', onlyCode=false, recent=false, ready=false, saving=false, pending=null, undo=null, pollBusy=false, toastTimer, editVersion=0;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hasCode=r=>/^[A-Za-z0-9]{4,24}$/.test(r.code||'');
function note(text,error=false){$('save-message').textContent=text;$('footer').classList.toggle('error',error);$('retry').hidden=!error;}
function toast(text,action=null){clearTimeout(toastTimer);$('toast-text').textContent=text;$('toast').hidden=false;undo=action;$('undo').hidden=!action;toastTimer=setTimeout(()=>$('toast').hidden=true,action?10000:3200);}
function closeSheets(){$('today-sheet').hidden=$('menu-sheet').hidden=true;$('today').setAttribute('aria-expanded','false');$('more').setAttribute('aria-expanded','false');interaction();}
function current(){return companies.find(c=>c.name===selected);}
function setSnapshot(data){
 const changed=!ready||JSON.stringify(data.companies||companies)!==JSON.stringify(companies)||JSON.stringify(data.statuses||statuses)!==JSON.stringify(statuses);
 if(data.companies)companies=data.companies;
 statuses=data.statuses||statuses;
 if(pending)statuses[pending.name]=pending.status;
 $('today-count').textContent=data.todayUnavailable?'—':String((data.today||[]).length);
 $('today-list').innerHTML=(data.today||[]).length?data.today.map(n=>`<li>${esc(n)}<small>已记录 ✓</small></li>`).join(''):'<li>今天还没有记录。投完一家，点「记为已投」就好。</li>';
 $('date-line').textContent=`${data.date||''} · 每一步都算数`;
 if(data.shell)window.shellState(data.shell);
 if(data.warning)note(data.warning,true);
 ready=true;if(changed)render();
}
function render(){
 $('total').textContent=companies.length;$('todo').textContent=companies.filter(c=>(statuses[c.name]||'未投')==='未投').length;$('applied').textContent=companies.filter(c=>applied.has(statuses[c.name])).length;
 const query=$('search').value.trim().toLowerCase(),owner=$('owner').value,stage=$('stage').value;
 filtered=companies.filter(c=>{
  const st=statuses[c.name]||'未投';
  return (!query||[c.name,c.roles,c.city,c.code,c.note,c.industry,c.owner].join(' ').toLowerCase().includes(query))&&
  (tab==='all'||(tab==='applied'?applied.has(st):st===tab))&&(owner==='全部性质'||c.owner===owner)&&(stage==='全部进度'||st===stage)&&(!onlyCode||hasCode(c))&&(!recent||c.added);
 });
 if(!filtered.some(c=>c.name===selected))selected=filtered[0]?.name||'';
 $('count').textContent=`${filtered.length} 家`;$('clear').hidden=!query;
 $('filter-toggle').textContent=(owner!=='全部性质'||stage!=='全部进度')?'筛选 · 已生效':'筛选 ▾';
 const scroll=$('companies').scrollTop;
 $('companies').innerHTML=filtered.length?filtered.map(c=>{
  const st=statuses[c.name]||'未投',badge=applied.has(st)?'done':'';
  return `<li><button class="company-row" data-name="${esc(c.name)}" aria-pressed="${c.name===selected}" title="${esc(c.name)}"><span class="initial" aria-hidden="true">${esc(c.name[0])}</span><span class="company-text"><strong>${esc(c.name)}</strong><small>${esc(c.owner)} · ${esc(c.city)}${c.added?' · 新增':''}</small></span><span class="badge ${badge} ${st==='面试'?'interview':''}">${esc(st)}</span></button></li>`;
 }).join(''):'<li class="empty"><b>这组条件下，暂时没找到。</b><p>试试换个关键词，或放宽筛选。</p><button id="reset">清空全部筛选</button></li>';
 $('companies').scrollTop=scroll;renderDetail();
}
function renderDetail(){
 const c=current();$('selected').hidden=!c;if(!c)return;
 const st=statuses[c.name]||'未投';
 $('company-name').textContent=c.name;$('company-name').title=c.name;$('company-roles').textContent=c.roles+' · '+c.city;
 $('details').textContent=`${c.owner} · ${c.industry}\n截止：${c.deadline||'日期待核实'} / ${c.deadlineText}\n来源 / 备用码：${c.source||'未提供'}\n${c.note}\n入口：${c.url||'见备注'}`;
 $('code').textContent=hasCode(c)?c.code:'暂未收录';$('copy').disabled=!hasCode(c);
 $('status').value=st;$('status').disabled=!ready||saving||!!pending;
 $('mark').disabled=!ready||saving||!!pending||applied.has(st);$('mark').textContent=applied.has(st)?'✓ 已记录':'✓ 记为已投';
 $('open').disabled=!/^https?:\/\//.test(c.url);$('open').childNodes[0].textContent=c.url.includes('bing.com/search')?'查找官方入口 ':'去官网投递 ';
}
function reset(){tab='all';onlyCode=recent=false;$('search').value='';$('owner').value='全部性质';$('stage').value='全部进度';document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab==='all'));$('only-code').setAttribute('aria-pressed','false');$('recent').setAttribute('aria-pressed','false');render();}
async function save(name,status,isUndo=false){
 if(saving||!ready)return;
 editVersion++;
 const previous=statuses[name]||'未投';pending={name,status,previous};saving=true;interaction();renderDetail();note('正在保存，请稍等…');
 try{const result=await bridge.save_status(name,status);pending=null;setSnapshot(result);note(result.warning||'已保存 · 进度和完整版同步',!!result.warning);toast(isUndo?'已撤销这次标记':`${name} · 已保存为${status}`,isUndo?null:{name,status:previous});}
 catch(e){note('还没确认保存成功 · 请重试，不要退出',true);}
 finally{saving=false;renderDetail();interaction();}
}
async function refresh(){
 if(pollBusy||saving||pending)return;pollBusy=true;
 const version=editVersion;
 try{const data=await bridge.snapshot();if(version!==editVersion||saving||pending)return;setSnapshot(data);if(!data.warning)note('本地保存 · 与完整版共用进度');}
 catch(e){if(version===editVersion&&!saving&&!pending){ready=false;renderDetail();note('暂时连不上台账 · 点击重试',true);}}
 finally{pollBusy=false;}
}
function interaction(){if(bridge?.interaction){const tag=document.activeElement?.tagName;bridge.interaction(!document.hasFocus()?false:(['INPUT','SELECT'].includes(tag)||!$('menu-sheet').hidden||!$('today-sheet').hidden),saving||!!pending).catch(()=>{});}}
window.shellState=s=>{document.body.classList.toggle('collapsed',!!s.collapsed);$('pin').setAttribute('aria-pressed',!!s.pinned);$('pin').title=s.pinned?'已固定，点击恢复自动收起':'固定后，离开也不收起';};
async function shell(action){if((saving||pending)&&['collapse','close'].includes(action)){toast('还有状态没保存好，先重试一下。');return;}closeSheets();try{window.shellState(await bridge.window_action(action));}catch(e){toast('窗口操作失败，请稍后重试。');}}
function step(delta){if(!filtered.length)return;const i=filtered.findIndex(c=>c.name===selected);selected=filtered[(i+delta+filtered.length)%filtered.length].name;render();document.querySelector('.company-row[aria-pressed=true]')?.scrollIntoView({block:'nearest'});}
$('search').addEventListener('input',render);$('clear').onclick=()=>{$('search').value='';render();$('search').focus();};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;$('stage').value='全部进度';document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
$('filter-toggle').onclick=()=>{const show=$('filter-extra').hidden;$('filter-extra').hidden=!show;$('filter-toggle').setAttribute('aria-expanded',show);};
$('only-code').onclick=()=>{onlyCode=!onlyCode;$('only-code').setAttribute('aria-pressed',onlyCode);render();};$('recent').onclick=()=>{recent=!recent;$('recent').setAttribute('aria-pressed',recent);render();};$('owner').onchange=$('stage').onchange=render;
$('companies').onclick=e=>{if(e.target.closest('#reset'))return reset();const b=e.target.closest('[data-name]');if(b){selected=b.dataset.name;$('details').hidden=true;$('details-toggle').setAttribute('aria-expanded','false');render();}};
$('copy').onclick=async()=>{if(!current())return;try{const code=await bridge.copy_code(selected);if(!window.pywebview)await navigator.clipboard.writeText(code);toast('内推码已复制，去表单粘贴吧。');}catch(e){toast('复制失败，可在详情中选择文字手动复制。');}};
$('open').onclick=async()=>{try{await bridge.open_role(selected);toast('入口已打开，投完后再记为已投。');}catch(e){toast('入口未打开，请在详情中查看网址。');}};
$('mark').onclick=()=>save(selected,'已投');$('status').onchange=()=>save(selected,$('status').value);$('next').onclick=()=>step(1);$('previous').onclick=()=>step(-1);
$('details-toggle').onclick=()=>{$('details').hidden=!$('details').hidden;$('details-toggle').setAttribute('aria-expanded',!$('details').hidden);};
$('retry').onclick=()=>pending?save(pending.name,pending.status):refresh();$('undo').onclick=()=>{const item=undo;$('toast').hidden=true;if(item)save(item.name,item.status,true);};$('toast-close').onclick=()=>{$('toast').hidden=true;};
$('pin').onclick=()=>shell('pin');$('collapse').onclick=()=>shell('collapse');$('edge').onclick=()=>shell('expand');document.querySelectorAll('[data-window]').forEach(b=>b.onclick=()=>shell(b.dataset.window));
$('today').onclick=()=>{const show=$('today-sheet').hidden;closeSheets();$('today-sheet').hidden=!show;$('today').setAttribute('aria-expanded',show);interaction();};$('more').onclick=()=>{const show=$('menu-sheet').hidden;closeSheets();$('menu-sheet').hidden=!show;$('more').setAttribute('aria-expanded',show);interaction();};document.querySelectorAll('.sheet-close').forEach(b=>b.onclick=closeSheets);
try{document.documentElement.dataset.theme=localStorage.getItem('companion-theme')||'light';}catch(e){}
$('theme').onclick=()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('companion-theme',t);}catch(e){}closeSheets();};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('today-sheet').hidden||!$('menu-sheet').hidden)closeSheets();else shell('collapse');}if(e.ctrlKey&&e.key==='f'){e.preventDefault();$('search').focus();}});
document.addEventListener('focusin',interaction);document.addEventListener('focusout',()=>setTimeout(interaction,0));window.addEventListener('blur',interaction);window.addEventListener('focus',()=>{interaction();refresh();});window.addEventListener('beforeunload',e=>{if(pending||saving){e.preventDefault();e.returnValue='';}});
function start(api){if(bridge)return;bridge=api;refresh();setInterval(refresh,5000);}
window.addEventListener('pywebviewready',()=>start(window.pywebview.api));
if(window.previewBridge)start(window.previewBridge);
</script></body></html>
